[project]
name = "betterrssforslack"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "authlib>=1.8.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "alembic>=1.20.0",
    "apscheduler>=3.11.3,<4.0",
    "feedparser>=6.0.14",
    "slack_sdk>=3.44.1",
    "html2text>=2025.4.15",
    "python-json-logger>=4.2.0",
    "psycopg[binary]>=3.3.5",
    "gunicorn>=26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.15.0",
    "responses>=0.26.3",
    "playwright>=1.62.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
